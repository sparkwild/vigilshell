<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="VigilShell">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f5f6f8" />
    </linearGradient>
    <filter id="surface-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#27313f" flood-opacity="0.1" />
    </filter>
    <filter id="mark-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1f252c" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect
    x="92"
    y="70"
    width="840"
    height="840"
    rx="190"
    fill="url(#surface)"
    stroke="#dfe2e7"
    stroke-width="2"
    filter="url(#surface-shadow)"
  />
  <image
    href="vigilshell-symbol-layer.png"
    x="118"
    y="129"
    width="788"
    height="788"
    preserveAspectRatio="none"
    filter="url(#mark-shadow)"
  />
</svg>
