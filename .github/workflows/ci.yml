name: CI
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess, re
          base = os.environ.get('BASE', '')
          docs_only = False
          native = os.environ['EVENT'] == 'pull_request'
          if re.fullmatch('[0-9a-f]{40}', base) and base != '0' * 40:
              result = subprocess.run(
                  ['git', 'diff', '--no-renames', '--name-only', '-z', base, 'HEAD', '--'],
                  capture_output=True,
              )
              if result.returncode == 0:
                  paths = [os.fsdecode(p) for p in result.stdout.split(b'\0') if p]
                  root_docs = {'README.md', 'CONTRIBUTING.md', 'AGENTS.md'}
                  docs_only = bool(paths) and all(
                      p in root_docs
                      or (p.startswith('docs/') and p.endswith('.md'))
                      or (p.startswith('docs/images/') and p.endswith(('.jpg', '.jpeg', '.png')))
                      for p in paths
                  )
                  pattern = r'^(crates/|scripts/|\.github/|src/(main|preload|contracts)/|resources/|tests/(e2e|development)/|Cargo\.(toml|lock)$|package(-lock)?\.json$|electron[.-]|rust-toolchain\.toml$|\.npmrc$|\.nvmrc$|LICENSE$)'
                  native = native and any(re.search(pattern, p) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('docs_only=' + str(docs_only).lower() + '\n')
              output.write('native=' + str(native).lower() + '\n')
          PY
  frontend:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    uses: ./.github/workflows/frontend.yml
  backend:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    uses: ./.github/workflows/backend.yml
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/package.yml
  verify:
    name: CI verified
    if: always()
    needs: [changes, frontend, backend, native]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == 'success', 'Change classification must succeed'
          outputs = jobs['changes']['outputs']
          code = 'skipped' if outputs['docs_only'] == 'true' else 'success'
          native = 'success' if outputs['native'] == 'true' else 'skipped'
          for name, expected in [('frontend', code), ('backend', code), ('native', native)]:
              actual = jobs[name]['result']
              assert actual == expected, f'{name}: expected {expected}, got {actual}'
          PY
