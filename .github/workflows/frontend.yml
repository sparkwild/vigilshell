name: Frontend
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Install protocol generator toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - run: npm run deps:check
      - run: npm run foundation:check
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:signing
      - run: npm run test:dev-session
      - run: npm run boundaries:check
      - run: npm run ui:check
      - run: node --test tests/development/ui-boundaries.test.mjs
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npx vitest run src/renderer
      - run: npm run test:icons
      - run: npx vitest run src/main src/shared
