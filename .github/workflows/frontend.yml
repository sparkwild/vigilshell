name: Frontend
'on':
  workflow_call:
    inputs:
      source-sha:
        type: string
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - name: Install protocol generator toolchain
        run: |
          rustup show active-toolchain
          node scripts/check-rust-toolchain.mjs
      - run: npm run deps:check
      - run: npm run foundation:check
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:signing
      - run: npm run test:packaging
      - run: npm run test:dev-session
      - run: node --test tests/development/ci-macos-startup.test.mjs
      - run: npm run boundaries:check
      - run: npm run ui:check
      - run: node --test tests/development/ui-boundaries.test.mjs
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npx vitest run src/renderer
      - run: npm run test:icons
      - run: npx vitest run src/main src/shared
      - run: npm run release:check
      - run: npm run test:release
