name: macOS signed packages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-signing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'sparkwild/vigilshell' && github.ref == 'refs/heads/main'
    environment: macos-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            rust: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x64
            rust: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked toolchains and dependencies
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_RUST: ${{ matrix.rust }}
        run: |
          test "$(node -p process.arch)" = "$EXPECTED_ARCH"
          rustup toolchain install 1.96.0 --profile minimal
          test "$(rustc +1.96.0 -vV | sed -n 's/^host: //p')" = "$EXPECTED_RUST"
          npm install --global npm@11.19.1
          npm ci
          npm run test:signing
      - name: Import the fixed release identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          VIGILSHELL_RELEASE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$VIGILSHELL_RELEASE_SIGNING_IDENTITY"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/vigilshell-release.keychain-db"
          SIGNING_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$SIGNING_PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/vigilshell-release.p12"
          security create-keychain -p "$SIGNING_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/vigilshell-release.p12" -k "$SIGNING_KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$SIGNING_PASSWORD" "$SIGNING_KEYCHAIN" >/dev/null
          security export -k "$SIGNING_KEYCHAIN" -t certs -f pemseq -o "$RUNNER_TEMP/vigilshell-release.cer"
          security add-trusted-cert -r trustRoot -p codeSign -k "$SIGNING_KEYCHAIN" "$RUNNER_TEMP/vigilshell-release.cer"
          security list-keychains -d user > "$RUNNER_TEMP/vigilshell-keychains-before.txt"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          echo "VIGILSHELL_RELEASE_SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          echo "VIGILSHELL_RELEASE_SIGNING_IDENTITY=$VIGILSHELL_RELEASE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          export VIGILSHELL_RELEASE_SIGNING_KEYCHAIN="$SIGNING_KEYCHAIN"
          npm run signing:check -- --profile release
      - name: Build and verify signed DMG
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: npm run package:release -- --arch "$PACKAGE_ARCH"
      - name: Upload verified packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VigilShell-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.dmg.sha256
            release/mac*/signing-report.json
      - name: Remove signing material
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/vigilshell-release.cer"; then
            security remove-trusted-cert "$RUNNER_TEMP/vigilshell-release.cer" || true
          fi
          security delete-keychain "$RUNNER_TEMP/vigilshell-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/vigilshell-release.p12" "$RUNNER_TEMP/vigilshell-release.cer"
          if test -f "$RUNNER_TEMP/vigilshell-keychains-before.txt"; then
            python3 -c 'import os,shlex,subprocess; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"vigilshell-keychains-before.txt"; subprocess.run(["security","list-keychains","-d","user","-s",*shlex.split(p.read_text())],check=True); p.unlink()'
          fi
