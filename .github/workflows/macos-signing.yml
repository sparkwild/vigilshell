name: macOS signed packages
'on':
  workflow_dispatch: {}
  push:
    tags:
      - v*-beta.*
permissions:
  contents: read
concurrency:
  group: macos-signing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-24.04
    outputs:
      storage: ${{ steps.storage.outputs.storage }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version-file: .nvmrc
      - run: node scripts/release-policy.mjs --source
        env:
          GH_TOKEN: ${{ github.token }}
      - id: storage
        env:
          STORAGE: ${{ vars.MACOS_SIGNING_STORAGE }}
        run: >-
          case "$STORAGE" in environment|repository) echo "storage=$STORAGE" >> "$GITHUB_OUTPUT" ;; *) echo
          "Missing signing storage configuration" >&2; exit 1 ;; esac
  frontend:
    needs: policy
    uses: ./.github/workflows/frontend.yml
  backend:
    needs: policy
    uses: ./.github/workflows/backend.yml
  package-environment:
    needs:
      - policy
      - frontend
      - backend
    if: ${{ needs.policy.outputs.storage == 'environment' }}
    environment: macos-release
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EXPECTED_ARCH: arm64
      EXPECTED_RUST: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/macos-package
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          VIGILSHELL_RELEASE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
  package-repository:
    needs:
      - policy
      - frontend
      - backend
    if: ${{ needs.policy.outputs.storage == 'repository' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EXPECTED_ARCH: arm64
      EXPECTED_RUST: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/macos-package
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          VIGILSHELL_RELEASE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
  publish:
    needs:
      - policy
      - frontend
      - backend
      - package-environment
      - package-repository
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.frontend.result == 'success' &&
      needs.backend.result == 'success' && (needs.package-environment.result == 'success' ||
      needs.package-repository.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: VigilShell-macos-arm64
          path: release-assets
      - run: node scripts/publish-beta.mjs
        env:
          GH_TOKEN: ${{ github.token }}
