name: macOS CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            rust: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x64
            rust: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: 1.96.0
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_RUST: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install and verify native toolchains
        run: |
          test "$(node -p process.arch)" = "$EXPECTED_ARCH"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_RUST"
          npm install --global npm@11.19.1
          npm ci
      - name: Backend checks
        run: npm run backend:check
      - name: Frontend and platform tests
        run: |
          npm run contracts:check
          npm run typecheck
          npm run test:signing
          npm run test:dev-session
          node --test tests/development/ci-macos-startup.test.mjs
          npx vitest run
      - name: Create disposable Dev signing identity
        run: bash scripts/ci-macos-signing.sh setup
      - name: Build and verify native Dev application
        run: npm run package:dev -- --arch "$EXPECTED_ARCH"
      - name: Verify application startup and shutdown
        run: |
          mkdir -p "$RUNNER_TEMP/vigilshell-ci-evidence"
          npm run test:ci-macos 2>&1 | tee "$RUNNER_TEMP/vigilshell-ci-evidence/startup.log"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-ci-${{ matrix.arch }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/vigilshell-ci-evidence/
            release/dev/mac*/signing-report.json
      - name: Remove disposable signing identity
        if: always()
        run: bash scripts/ci-macos-signing.sh cleanup
