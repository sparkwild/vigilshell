name: Build and verify macOS package
description: Fixed-identity ARM64 packaging and disposable keychain cleanup
runs:
  using: composite
  steps:
    - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - name: Install and verify native toolchains
      id: toolchain
      run: |
        test "$(node -p process.arch)" = "$EXPECTED_ARCH"
        rustup show active-toolchain
        node scripts/check-rust-toolchain.mjs
        test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_RUST"
        npm install --global "$(node -p "require('./package.json').packageManager")"
        npm ci
      shell: bash
    - name: Backend checks
      run: npm run backend:check
      shell: bash
    - name: Frontend and platform tests
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: |
        npm run contracts:check
        npm run typecheck
        npm run test:signing
        npm run test:dev-session
        node --test tests/development/ci-macos-startup.test.mjs
        npx vitest run
      shell: bash
    - name: Import fixed release signing identity
      id: signing
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      run: node scripts/ci-command.mjs 180 bash scripts/ci-macos-signing.sh setup-release
      shell: bash
    - name: Build and verify release application and DMG
      id: build
      if: ${{ !cancelled() && steps.signing.outcome == 'success' }}
      run: npm run package:release -- --arch "$EXPECTED_ARCH"
      shell: bash
    - name: Verify application startup and shutdown
      id: startup
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        mkdir -p "$RUNNER_TEMP/vigilshell-ci-evidence"
        npm run test:ci-macos 2>&1 | tee "$RUNNER_TEMP/vigilshell-ci-evidence/startup.log"
      shell: bash
    - name: Remove disposable signing identity
      if: always()
      run: node scripts/ci-command.mjs 120 bash scripts/ci-macos-signing.sh cleanup
      shell: bash
    - name: Upload verified release packages
      if: ${{ success() && steps.startup.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VigilShell-macos-arm64
        if-no-files-found: error
        retention-days: 7
        path: |
          release/*.dmg
          release/*.dmg.sha256
          release/mac*/signing-report.json
    - name: Upload diagnostic evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-ci-arm64-${{ github.run_attempt }}
        if-no-files-found: ignore
        retention-days: 7
        path: |
          ${{ runner.temp }}/vigilshell-ci-evidence/
          release/mac*/signing-report.json
