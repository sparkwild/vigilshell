[package]
license.workspace = true
name = "vigilshell-credentials"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[dependencies]
vigilshell-application-contracts = { path = "../vigilshell-application-contracts" }
vigilshell-domain = { path = "../vigilshell-domain" }
russh.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util.workspace = true
zeroize = "=1.9.0"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
sha2 = "=0.10.9"
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAlert", "NSImage", "NSMenu", "NSMenuItem", "NSApplication", "NSButton", "NSControl", "NSCell", "NSResponder", "NSSecureTextField", "NSTextField", "NSText", "NSView", "NSWindow", "NSOpenPanel", "NSSavePanel", "NSAppearance", "NSPanel", "NSRunningApplication"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry", "NSTimer", "NSRunLoop", "NSDate", "NSURL", "NSArray"] }
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }
security-framework-sys = "=2.17.0"
core-foundation = "=0.10.1"
[dev-dependencies]
tracing-subscriber.workspace = true
tempfile.workspace = true
vigilshell-storage-sqlite = { path = "../vigilshell-storage-sqlite" }

[build-dependencies]
serde_json.workspace = true
