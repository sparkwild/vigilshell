[workspace]
members = [
    "crates/vigilshell-credentials-macos",
    "crates/vigilshell-core",
    "crates/vigilshell-lifecycle-macos",
    "crates/vigilshell-storage-sqlite",
    "crates/vigilshell-transport-russh",
    "src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
russh = { path = "vendor/russh" }
