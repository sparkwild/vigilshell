[workspace]
resolver = "3"
members = ["crates/*"]
[workspace.package]
license = "Apache-2.0"
publish = false
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
[workspace.dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-util = { version = "=0.7.18", default-features = false, features = ["rt"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "registry", "fmt", "json", "env-filter"] }
rusqlite_migration = { git = "https://github.com/cljoly/rusqlite_migration", rev = "30b941a0850df790091dc58c3ec44f18dbb5e3ba", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }

# SSH and native credentials share one key parser and cryptographic provider.
[workspace.dependencies.russh]
version = "=0.65.0"
default-features = false
features = ["ring", "rsa"]
