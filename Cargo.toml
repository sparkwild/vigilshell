[workspace]
resolver = "3"
members = ["crates/*"]
[workspace.package]
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
[workspace.dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-util = { version = "=0.7.18", default-features = false, features = ["rt"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "registry", "fmt", "json", "env-filter"] }
rusqlite_migration = { version = "=2.6.0", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

# SSH and native credentials share one key parser and cryptographic provider.
[workspace.dependencies.russh]
version = "=0.63.3"
default-features = false
features = ["ring", "rsa"]
