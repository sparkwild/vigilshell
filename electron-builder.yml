appId: com.sparkwild.vigilshell.electron
productName: VigilShell
artifactName: 'VigilShell-${version}-macos-${arch}.${ext}'
directories:
  output: release
  buildResources: resources/icons
files:
  - from: '${env.VIGILSHELL_BUILD_ROOT}/out'
    to: out
    filter:
      - '**/*'
      - '!**/*.map'
  - package.json
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.{d.ts,d.mts,d.cts}'
  - '!node_modules/**/{test,tests,__tests__,spec,fixtures,__fixtures__,__snapshots__,benchmark,benchmarks,example,examples}{,/**}'
  - '!node_modules/**/*.{test,spec}.*'
  - '!node_modules/**/{README*,readme*,CHANGELOG*,changelog*,CONTRIBUTING*,AGENTS.md,.eslintrc*,tsconfig*.json,.runkit_example.js}'
extraResources:
  - from: '${env.VIGILSHELL_BUILD_ROOT}/native/mcp-native/authorization.node'
    to: native/mcp-identity.node
  - from: '${env.VIGILSHELL_BUILD_ROOT}/native/notification-native/authorization.node'
    to: native/authorization.node
  - from: '${env.VIGILSHELL_BUILD_ROOT}/backend/manifest.json'
    to: backend/manifest.json
  - from: resources/icons
    to: icons
    filter:
      - app-icon-source.png
      - tray-icon.png
  - from: resources/licenses
    to: licenses
    filter:
      - '**/*'
      - '!LICENSES.chromium.html'
extraFiles:
  - from: '${env.VIGILSHELL_BUILD_ROOT}/backend'
    to: Helpers
    filter:
      - VigilShell.app/**
      - VigilShell Dev.app/**
      - VigilShell Credential Input.app/**
afterPack: ./scripts/prepare-package.mjs
afterSign: ./scripts/verify-package.mjs
artifactBuildCompleted: ./scripts/sign-artifact.mjs
mac:
  category: public.app-category.developer-tools
  icon: resources/icons/icon.icns
  sign: ./scripts/sign-package.mjs
  forceCodeSigning: true
  notarize: false
  hardenedRuntime: false
  signIgnore:
    - '\.(png|icns|ico|svg)$'
  target:
    - dmg
    - zip
  extraDistFiles:
    - resources/licenses/electron-LICENSE.txt
dmg:
  sign: false
  writeUpdateInfo: false
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
    - x: 270
      y: 315
      type: file
      path: node_modules/electron/dist/LICENSES.chromium.html
