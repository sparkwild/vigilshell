appId: com.sparkwild.vigilshell.electron
productName: VigilShell
artifactName: 'VigilShell-${version}-macos-${arch}.${ext}'
directories:
  output: release
  buildResources: resources/icons
files:
  - from: '${env.VIGILSHELL_BUILD_ROOT}/out'
    to: out
    filter:
      - '**/*'
  - package.json
extraResources:
  - from: '${env.VIGILSHELL_BUILD_ROOT}/native/mcp-native/authorization.node'
    to: native/mcp-identity.node
  - from: '${env.VIGILSHELL_BUILD_ROOT}/native/notification-native/authorization.node'
    to: native/authorization.node
  - from: '${env.VIGILSHELL_BUILD_ROOT}/backend/manifest.json'
    to: backend/manifest.json
  - from: resources/icons
    to: icons
  - from: resources/licenses
    to: licenses
extraFiles:
  - from: '${env.VIGILSHELL_BUILD_ROOT}/backend'
    to: Helpers
    filter:
      - VigilShell.app/**
      - VigilShell Dev.app/**
      - VigilShell Credential Input.app/**
afterSign: ./scripts/verify-package.mjs
artifactBuildCompleted: ./scripts/sign-artifact.mjs
mac:
  category: public.app-category.developer-tools
  icon: resources/icons/icon.icns
  sign: ./scripts/sign-package.mjs
  forceCodeSigning: true
  notarize: false
  hardenedRuntime: false
  signIgnore:
    - '\.(png|icns|ico|svg)$'
  target: dmg
dmg:
  sign: false
